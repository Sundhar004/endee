version: '3.8'
services:
  endee:
    image: endeeio/endee-server:latest
    container_name: endee-server
    ports:
      - "8080:8080"
    volumes:
      - ./endee-data:/data
  backend:
    build: .
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      - ENDEE_URL=http://endee:8080/api/v1
    depends_on:
      - endee
  frontend:
    image: nginx:alpine
    container_name: rag-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
